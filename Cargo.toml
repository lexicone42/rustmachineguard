[package]
name = "rustmachineguard"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "AI-agent posture scanner for developer machines: inventory, threat catalog, MCP probing, scan diffing, CycloneDX Blueprint, compliance evidence"
license = "Apache-2.0"
# Began (2026-03) as a Rust rewrite of https://github.com/step-security/dev-machine-guard (Apache-2.0); see NOTICE.

[[bin]]
name = "rmguard"
path = "src/main.rs"

[features]
default = ["otel"]
# OpenTelemetry export (opt-in at runtime with --otel). See docs/OPENTELEMETRY.md.
# Every otel crate is default-features = false: that keeps `internal-logs` (and with it
# `tracing`) off so the SDK can never print, and keeps reqwest/hyper/tokio out -- export
# goes through our own ureq client (src/otel/sdk.rs). Cost of default-on: about +1.6 MB
# (21%) on the release binary; no measurable run time with export off.
otel = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:opentelemetry-http", "dep:async-trait"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "7"
colored = "3"
glob = "0.3"
which = "8"
whoami = "2"
base64 = "0.23"
# Pure safe Rust (`#![forbid(unsafe_code)]`); replaced serde_yaml_ng, whose libyaml
# translation (unsafe-libyaml) is unmaintained (RUSTSEC-2024-0449). Limits: src/scanners/yaml.rs.
serde-saphyr = { version = "2.0.0", default-features = false, features = ["deserialize"] }
toml = "1"
sha2 = "0.11.0"
libc = "0.2.186"
semver = "1.0.28"
ureq = { version = "3.3.0", default-features = false, features = ["rustls"] }
# JetBrains plugin descriptors live inside jars; only deflate is needed to read META-INF/plugin.xml.
zip = { version = "9.0", default-features = false, features = ["deflate"] }
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace", "metrics"], optional = true }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace", "metrics"], optional = true }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["http-proto", "trace", "metrics"], optional = true }
opentelemetry-http = { version = "0.33.1", default-features = false, optional = true }
# HttpClient::send_bytes is an #[async_trait] method and opentelemetry-http does not
# re-export the macro.
async-trait = { version = "0.1.89", optional = true }

[dev-dependencies]
jsonschema = "0.60"
proptest = "1"
# Decode the OTLP bodies the in-test collector receives (tests/otel_export.rs).
# default-features = false: the default `full` pulls tonic.
opentelemetry-proto = { version = "0.33.1", default-features = false, features = ["gen-tonic-messages", "trace", "metrics"] }
prost = { version = "0.14", default-features = false, features = ["std"] }
