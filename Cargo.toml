[package]
name = "rustmachineguard"
version = "0.1.0"
edition = "2024"
description = "AI-agent posture scanner for developer machines: inventory, threat catalog, MCP probing, scan diffing, CycloneDX Blueprint, compliance evidence"
license = "Apache-2.0"
# Began (2026-03) as a Rust rewrite of https://github.com/step-security/dev-machine-guard (Apache-2.0); see NOTICE.

[[bin]]
name = "rmguard"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
colored = "3"
glob = "0.3"
which = "8"
whoami = "2"
base64 = "0.22"
serde_yaml_ng = "0.10"
toml = "1"
sha2 = "0.11.0"
libc = "0.2.186"
semver = "1.0.28"
ureq = { version = "3.3.0", default-features = false, features = ["rustls"] }
# JetBrains plugin descriptors live inside jars; only deflate is needed to read META-INF/plugin.xml.
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[dev-dependencies]
jsonschema = "0.46.7"
proptest = "1"
